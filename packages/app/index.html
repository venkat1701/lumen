    <script>
      // Set before first paint so the page never flashes the wrong palette.
      try {
        var light = ['paper', 'one-light', 'solarized']
        var dark = ['ink', 'tokyo-night', 'one-dark', 'nord', 'gruvbox']
        var saved = localStorage.getItem('lumen.theme')
        var known = light.concat(dark)
        var id = known.indexOf(saved) === -1 ? 'paper' : saved
        document.documentElement.dataset.theme = id
        document.documentElement.dataset.mode = light.indexOf(id) === -1 ? 'dark' : 'light'
      } catch {}
    </script>
