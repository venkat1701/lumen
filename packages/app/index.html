<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lumen</title>
    <meta name="description" content="A Markdown reader for research writing: mathematics, numbered theorems, cross-references and diagrams." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23111111'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='21' font-weight='600' fill='%23faf9f7' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;0,7..72,700;1,7..72,400;1,7..72,500;1,7..72,600&amp;display=swap"
      rel="stylesheet"
    />
    <script>
      // Set before first paint so the page never flashes the wrong palette.
      try {
        var light = ['paper', 'one-light', 'solarized']
        var dark = ['ink', 'tokyo-night', 'one-dark', 'nord', 'gruvbox']
        var saved = localStorage.getItem('lumen.theme')
        var known = light.concat(dark)
        var fallback = matchMedia('(prefers-color-scheme: dark)').matches ? 'ink' : 'paper'
        var id = known.indexOf(saved) === -1 ? fallback : saved
        document.documentElement.dataset.theme = id
        document.documentElement.dataset.mode = light.indexOf(id) === -1 ? 'dark' : 'light'
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
